# LogHarvest 前端 Nginx 配置（非 root 完整主配置：pid/缓存/临时目录全部落 /tmp）。
# 容器内以 nginx 用户监听 8080；宿主机端口由 compose WEB_PORT 映射。

pid /tmp/nginx.pid;
# worker 进程固定降权到 nginx 用户（官方镜像内置，uid 101）；主进程仅负责开端口/日志/预建临时目录
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 安全响应头（保守集合；CSP 需真实浏览器验证后启用，见部署文档）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

        # SPA 路由 history 模式回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源可长缓存
        location /static/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # 控制面 API 反代；SSE 需要关闭缓冲并延长读超时
        location /api/ {
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE（GET /api/jobs/{id}/events）：禁缓冲、长读超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
        }
    }
}
