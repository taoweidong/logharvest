[project]
name = "logharvest-service"
version = "0.1.0"
description = "LogHarvest compressed log rule extraction service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2.0",
  "regex>=2024.5.15",
  "orjson>=3.10.0",
  "structlog>=24.1.0",
  "prometheus-client>=0.20.0",
  "pathspec>=0.12.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.0",
  "alembic>=1.13.0",
  "psutil>=6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "hypothesis>=6.100.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
