[project]
name = "logharvest-service"
version = "0.1.0"
description = "LogHarvest compressed log rule extraction service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2.0",
  "regex>=2024.5.15",
  "orjson>=3.10.0",
  "structlog>=24.1.0",
  "prometheus-client>=0.20.0",
  "pathspec>=0.12.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.0",
  "alembic>=1.13.0",
  "psutil>=6.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "hypothesis>=6.100.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
  # 以下三条来自依赖自身的弃用提示，本仓库无法修复；保留其余告警可见。
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
  "ignore:The default datetime adapter is deprecated as of Python 3.12:DeprecationWarning",
  "ignore:GitWildMatchPattern .* is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
files = ["src/domain", "src/worker", "src/application/worker", "src/config"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jose", "psutil", "regex"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF", "BLE"]
ignore = [
  "RUF001",  # 中文注释/字符串中的全角标点是项目约定
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # Alembic 需要先读取并改写 config，再导入模型
"tests/conftest.py" = ["E402"]  # 测试密钥与告警过滤必须先于 src/fastapi 导入生效
